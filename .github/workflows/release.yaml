name: Release New Version

#
# This action builds, tests, and releases new versions of gab.
#

on:
  push:
    branches: [ "main" ]

env:
  version: 0.1.1
  GH_TOKEN: ${{ github.token }}

jobs:
  create_release:
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check for existing tag
        continue-on-error: true
        id: tag_check
        run: git ls-remote --tags | grep '${{ env.version }}' 

      # Create a release if we didn't find an existing tag
      - name: Create Release
        if: ${{ steps.tag_check.outcome == 'failure' }}
        run:  gh release create -R '${{ github.repository }}' '${{ env.version }}' --generate-notes

  build_artifacts:
    runs-on: ubuntu-latest
    needs: create_release

    permissions: write-all

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64
        os:
          - macos-none
          - linux-gnu
          - windows-gnu

    steps:
    - uses: actions/checkout@v4

    - name: Setup Gab
      run: |
        curl -L -f https://github.com/gab-language/cgab/releases/download/0.1.5/gab-cgab-0.1.5-x86_64-linux-gnu.exe -o gab
        chmod +x gab
        ./gab get -n -y -t '${{ matrix.arch }}-${{ matrix.os }}'
        ./gab info

    - name: Build release
      run: |
          ./gab build -t '${{ matrix.arch }}-${{ matrix.os }}' -m github.com/gab-language/cgab@0.1.5 -m gwordle@${{ env.version }}:word_bank.csv -m gwordle@${{ env.version }}:valid_words.csv gwordle@${{ env.version }}

    - name: Upload release artifact
      run: |
        gh release upload -R '${{ github.repository }}' '${{ env.version }}' 'gwordle@${{ env.version }}-cgab-0.1.5-${{ matrix.arch }}-${{ matrix.os }}' || exit 0
